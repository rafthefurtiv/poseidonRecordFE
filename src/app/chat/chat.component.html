<div class="loading-wrap" *ngIf="loading">
  <div class="spinner-border text-success" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>

<div class="chat-header" *ngIf="entered">
  <div class="avatar">{{ owner.charAt(0) }}</div>
  <div style="flex:1">
    <div>Chat globale</div>
    <div class="status">
      <span *ngIf="connectionState === RxStompState.OPEN">online</span>
      <span *ngIf="connectionState === RxStompState.CONNECTING">connessione…</span>
      <span *ngIf="connectionState === RxStompState.CLOSING">disconnessione…</span>
      <span *ngIf="connectionState === RxStompState.CLOSED">offline</span>
    </div>
  </div>
</div>

<div *ngIf="entered; else loginBox">
  <div #divToScroll class="chat" id="chat"
       style="height: 68%; display:flex; flex-direction: column; overflow-y: auto;">
    <div *ngFor="let m of messaggi" class="msg-row" [class.me]="m.from == owner">
      <div class="bubble" [class.me]="m.from == owner" [class.them]="m.from != owner">
        <div class="bubble-from" *ngIf="m.from != owner">{{ m.from }}</div>
        {{ m.messaggio }}
        <span class="time">{{ m.timestamp?.substring(11, 16) }}</span>
      </div>
    </div>
  </div>

  <div class="emoji-panel" *ngIf="showEmoji">
    <span *ngFor="let e of emojiList" class="emoji-item" (click)="addEmoji(e)">{{ e }}</span>
  </div>

  <div class="input-bar">
    <button (click)="toggleEmoji()" type="button"
            class="btn-icon" [class.active]="showEmoji" ngbTooltip="Emoji">
      <i class="far fa-smile"></i>
    </button>

    <input (keydown.enter)="invia()" type="text" [(ngModel)]="testo"
           placeholder="Scrivi un messaggio">

    <button (click)="invia()" type="button"
            class="btn-circle btn-send" ngbTooltip="Invia" placement="left">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>

  <button (click)="ricarica()" type="button"
          class="btn-circle btn-reload" ngbTooltip="Ricarica">
    <i class="fas fa-sync-alt"></i>
  </button>
</div>

<ng-template #loginBox>
  <div class="login-box">
    <h3>Entra nella chat</h3>
    <input class="login-input" type="text" [(ngModel)]="owner"
           placeholder="Il tuo nome"
           (keydown.enter)="carica()">
    <button (click)="carica()" type="button"
            class="btn btn-success btn-block"
            [disabled]="!owner">
      <i class="fas fa-sign-in-alt"></i>&nbsp; Entra
    </button>
  </div>
</ng-template>
