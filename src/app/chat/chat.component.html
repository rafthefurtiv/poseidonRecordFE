<div class="center" style="padding: 300px; width: 300px" *ngIf="loading">
  <div class="spinner-border text-primary" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>

<div class="mt-4 chat">
</div>

<div #divToScroll class="col chat" id="chat" style="height: 68%; width: 100%;
    display:flex; flex-direction: column; overflow-y: auto;">
  <div *ngFor="let m of messaggi" >

    <div class="row">

      <div class="col-6 mt-2" *ngIf="m.owner != owner">
        <div class="chat-bubble" style="text-align: left;"> {{m.messaggio}} 
          <div style="text-align: right;">
            <small> {{m.timestamp.substring(11, 16)}}</small>
          </div>
        </div>
        
      </div>

      <div class="col-7 mt-2" *ngIf="m.owner == owner">
      </div>

      <div class="col-5 mt-2" *ngIf="m.owner == owner">
        <div class="chat-bubble-me" style="text-align: left;"> {{m.messaggio}} 
          <div style="text-align: right;">
            <small> {{m.timestamp.substring(11, 16)}}</small>
          </div>
        </div>

      </div>
      
    </div>
  </div>
</div>

<div class="row mt-3">
  <div class="col-9 pl-4 pr-1">
    <input (keydown.enter)="invia()" style="width: 100%; height: 100%; border-radius: 10px;" type="text" [(ngModel)]="testo">
  </div>
  <div class="col-3 d-flex pl-0 pr-4" *ngIf="owner">
    <button (click)="invia()" type="button" class="btn btn-success btn-lg btn-block" placement="right" ngbTooltip="Invia" style="float: right;">
      Invia
    </button>
  </div>
  <div class="col-3 d-flex pl-0 pr-4" *ngIf="!owner">
    <button (click)="carica()" type="button" class="btn btn-primary btn-lg btn-block" placement="left" ngbTooltip="Carica">
      Carica
    </button>
  </div>
</div>

<div class="container mt-3">
  <div class="row">
    <div class="col-4"></div>
    <div class="col-4 align-self-center" *ngIf="owner">
      <button (click)="ricarica()" type="button" class="btn btn-info btn-lg btn-block" ngbTooltip="Carica">
        Ricarica
      </button>
    </div>
    <div class="col-4"></div>
  </div>
</div>
